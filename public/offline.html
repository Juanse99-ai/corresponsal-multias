<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sin conexión · Barrio Centro Sabanalarga 18</title>
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; margin: 0; }
      body {
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", system-ui, sans-serif;
        background: #f5f7fb;
        color: #28304a;
        text-align: center;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #1a1f29; color: #e9edf6; }
        .sub { color: #9aa6bd !important; }
      }
      .card { max-width: 22rem; display: flex; flex-direction: column; align-items: center; gap: 14px; }
      .logo { width: 64px; height: 64px; border-radius: 16px; background: #000; padding: 8px; }
      .logo img { width: 100%; height: 100%; object-fit: contain; }
      h1 { font-size: 1.25rem; font-weight: 600; letter-spacing: -0.01em; }
      .sub { font-size: 0.95rem; line-height: 1.5; color: #5a647e; }
      button {
        margin-top: 6px;
        font: inherit;
        font-weight: 500;
        color: #fff;
        background: #2f57b6;
        border: none;
        border-radius: 999px;
        padding: 11px 22px;
        cursor: pointer;
      }
      button:active { transform: scale(0.97); }
    </style>
  </head>
  <body>
    <div class="card">
      <span class="logo"><img src="/logo-multias.jpg" alt="Multidiagnósticos AS" /></span>
      <h1>Sin conexión</h1>
      <p class="sub">No hay señal en este momento. Revisa tu conexión y vuelve a intentar; no se muestran datos para evitar números desactualizados.</p>
      <button onclick="location.reload()">Reintentar</button>
    </div>
  </body>
</html>
