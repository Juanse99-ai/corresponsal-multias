<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sin conexión · Barrio Centro Sabanalarga 18</title>
    <style>
      /* Sin el CSS de la app (no hay señal): los colores de los temas Azul y
         Noche van escritos aquí. */
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; margin: 0; }
      body {
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        background: #e7ecf4;
        color: #0f172a;
        text-align: center;
      }
      .card { max-width: 22rem; display: flex; flex-direction: column; align-items: center; gap: 12px; }
      .logo { width: 64px; height: 64px; border-radius: 16px; background: #000; padding: 8px; margin-bottom: 4px; }
      .logo img { width: 100%; height: 100%; object-fit: contain; }
      h1 { font-size: 22px; line-height: 1.15; font-weight: 600; letter-spacing: -0.4px; }
      .sub { font-size: 15px; line-height: 1.5; color: #475569; }
      button {
        margin-top: 8px;
        height: 44px;
        padding: 0 20px;
        font: inherit;
        font-size: 15px;
        font-weight: 600;
        color: #fff;
        background: #1d4ed8;
        border: none;
        border-radius: 999px;
        box-shadow: 0 1px 2px rgba(20, 50, 160, 0.25), 0 6px 16px -6px rgba(29, 78, 216, 0.5);
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
        transition: transform 140ms cubic-bezier(0.32, 0.72, 0, 1);
      }
      button:active { transform: scale(0.96); }
      button:focus-visible { outline: 2px solid #1d4ed8; outline-offset: 2px; }
      @media (prefers-color-scheme: dark) {
        body { background: #000; color: #f2f2f5; }
        .sub { color: #a2a2ad; }
        button { background: #2563eb; box-shadow: 0 6px 18px -8px rgba(37, 99, 235, 0.75); }
        button:focus-visible { outline-color: #5b8cff; }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <span class="logo"><img src="/logo-multias.jpg" alt="Multidiagnósticos AS" /></span>
      <h1>Sin conexión</h1>
      <p class="sub">No hay señal en este momento. Revisa tu conexión y vuelve a intentar; no se muestran datos para evitar números desactualizados.</p>
      <button onclick="location.reload()">Reintentar</button>
    </div>
  </body>
</html>
